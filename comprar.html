<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Compra | TraumaShop</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&family=Almendra:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <img src="C:\Users\Pc\Downloads\logo-tienda.png" alt="Logo TraumaShop" width="60">
                <img src="img/logo-tienda.png" alt="Logo TraumaShop" width="60">
                <h1>TraumaShop</h1>
            </div>

            <!-- Checkbox oculto para el menú hamburguesa -->
            <input type="checkbox" id="menu-toggle">
            
            <!-- Etiqueta que se ve como hamburguesa -->
            <label for="menu-toggle" class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="listado_tabla.html">Listado Tabla</a></li>
                    <li><a href="listado_box.html">Listado Box</a></li>
                    <li><a href="producto.html">Producto</a></li>
                    <li><a href="comprar.html">Comprar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Gestión de Compra</h2>

        <!-- Sección de selección de productos -->
        <div class="carrito-box">
            <h3>Selecciona tus productos</h3>
            <form action="#" method="post">
                <div class="product-list-check">
                    <label><input type="checkbox" name="productos" value="ferula"> Férula de Muñeca - $25.000</label>
                    <label><input type="checkbox" name="productos" value="ortesis"> Ortesis de Rodilla - $45.000</label>
                    <label><input type="checkbox" name="productos" value="collar"> Collares Cervicales - $18.000</label>
                    <label><input type="checkbox" name="productos" value="muletas"> Muletas de Aluminio - $32.000</label>
                    <label><input type="checkbox" name="productos" value="faja"> Faja Lumbar - $28.000</label>
                </div>
                <!-- El botón de enviar "gestiona" la compra -->
                <button type="submit" class="btn-vaciar">Procesar Selección</button>
            </form>
        </div>

        <!-- Formulario de datos del cliente -->
        <form class="purchase-form">
            <h3>Datos de Envío</h3>
            <div class="form-group">
                <label for="cliente">Nombre del Cliente:</label>
                <input type="text" id="cliente" name="cliente" required>
            </div>
            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="pago">Medio de Pago:</label>
                <select id="pago" name="pago" required>
                    <option value="">Seleccione un método de pago</option>
                    <option value="tarjeta_credito">Tarjeta de Crédito</option>
                    <option value="tarjeta_debito">Tarjeta de Débito</option>
                    <option value="transferencia">Transferencia Bancaria</option>
                    <option value="efectivo">Efectivo (Retiro en tienda)</option>
                    <option value="mercadopago">Mercado Pago</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Confirmar Compra</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 TraumaShop - Instituto de Traumatología. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
