<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Usuarios | La Tienda del Traumatólogo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .hidden { display: none; }
        .login-container { max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .msg-error { color: red; font-size: 0.9em; margin-top: 10px; }
        .msg-exito { color: green; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">
                <img src="img/logo-tienda.png" alt="Logo TraumaShop" width="60">
                <h1>La Tienda del Traumatólogo</h1>
            </div>
            <nav>
                <ul class="nav-principal">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="listado_box.html">Listado Box</a></li>
                    <li><a href="producto.html">Producto</a></li>
                    <li><a href="login.html">Ingresar</a></li>
                </ul>
            </nav>

            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon" aria-label="Abrir menú de navegación">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <nav class="menu-secundario">
                <ul>
                    <li class="item-movil"><a href="index.html">Inicio</a></li>
                    <li class="item-movil"><a href="listado_box.html">Listado Box</a></li>
                    <li class="item-movil"><a href="producto.html">Producto</a></li>
                    <li class="item-movil item-movil-fin"><a href="login.html">Ingresar</a></li>
                    <li><a href="listado_tabla.html">Listado Tabla</a></li>
                    <li><a href="comprar.html">Comprar</a></li>
                    <li><a href="presupuesto.html">Presupuesto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- VISTA VISITANTE (LOGIN Y REGISTRO) -->
        <div id="vista-visitante" class="login-container" style="max-width: 500px;">
            
            <!-- Pestañas -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
                <button id="tab-login" class="btn-submit" style="background-color: #09246e; width: auto; padding: 10px 20px;">Iniciar Sesión</button>
                <button id="tab-registro" class="btn-vaciar" style="background-color: #aaa; width: auto; padding: 10px 20px;">Registrarse</button>
            </div>

            <!-- Formulario Login -->
            <div id="form-login-box">
                <h2>Iniciar Sesión</h2>
                <form id="formulario-login">
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn-submit">Ingresar</button>
                    <div id="mensaje-login" class="msg-error"></div>
                </form>
            </div>

            <!-- Formulario Registro (Oculto por defecto) -->
            <div id="form-registro-box" style="display: none;">
                <h2>Crear Cuenta</h2>
                <form id="formulario-registro">
                    <div class="form-group">
                        <label for="reg-nombre">Nombre Completo:</label>
                        <input type="text" id="reg-nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Correo Electrónico:</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña:</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit" class="btn-submit" style="background-color: #27ae60;">Registrarme</button>
                    <div id="mensaje-registro" class="msg-exito"></div>
                </form>
            </div>
        </div>

        <!-- VISTA USUARIO AUTENTICADO -->
        <div id="vista-autenticado" class="login-container hidden">
            <h2>Panel de Usuario</h2>
            <p id="mensaje-bienvenida"></p>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <button id="btn-logout" class="btn-vaciar">Cerrar Sesión</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
