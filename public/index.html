<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tienda de insumos de traumatología y osteosíntesis.">
  <title>La Tienda del Traumatólogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>
  <header>
    <div class="header-content">
      <div class="logo">
        <img src="img/logo-tienda.png" alt="" width="60" height="60">
        <h1>La Tienda del Traumatólogo</h1>
      </div>
      <nav aria-label="Principal">
        <ul class="nav-principal">
          <li><a href="#/inicio">Inicio</a></li>
          <li><a href="#/catalogo">Catálogo</a></li>
          <li><a href="#/ingresar" class="enlace-sesion">Ingresar</a></li>
        </ul>
      </nav>
      <button type="button" class="menu-icon" id="btn-menu" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="menu-movil">
        <span></span><span></span><span></span>
      </button>
      <nav class="menu-secundario" id="menu-movil" aria-label="Menú móvil">
        <ul>
          <li class="item-movil"><a href="#/inicio">Inicio</a></li>
          <li class="item-movil"><a href="#/catalogo">Catálogo</a></li>
          <li class="item-movil"><a href="#/ingresar" class="enlace-sesion">Ingresar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenedor donde app.js monta cada vista; aria-live avisa los cambios a lectores de pantalla -->
  <main id="vista" tabindex="-1" aria-live="polite"></main>

  <footer><p>&copy; 2026 La Tienda del Traumatólogo. Todos los derechos reservados.</p></footer>

  <template id="tpl-inicio">
    <div class="contenedor-principal">
            
        <!-- COLUMNA IZQUIERDA: HERO (Con texto extra para llenar el espacio) -->
        <div class="columna-hero">
            <section class="hero">
                <h2>Bienvenido</h2>

                <div class="hero-contenido">
                    <img src="img/imagenindex.jpg" alt="Imagen representativa de TraumaShop" class="hero-image">
                    
                    <div class="hero-text">
                        <p>
                         Ofrecemos productos especializados en salud musculoesquelética, respaldados por el <strong>Instituto de Traumatología</strong>.
                        </p>
                        <p>
                            Nuestro catálogo incluye una amplia variedad de férulas, ortesis, placas, tornillos y kits de osteosíntesis, diseñados para satisfacer las necesidades de los profesionales de la salud.
                        </p>
                        
                        <p>
                            Explora nuestro catálogo y encuentra el apoyo que necesitas para tu recuperación y bienestar.
                        </p>
                    </div>
                </div>
            </section>
        </div>

        <!-- COLUMNA DERECHA: ESQUELETO -->
        <div class="columna-esqueleto">
            <div class="caja-esqueleto">
                <div class="seccion-titulos">
                    <h1>Presiona un Hueso para Ver los Productos</h1>
                    <h2>PLACAS Y TORNILLOS PARA OSTEOSINTESIS</h2>
                </div>

                <div class="esqueleto-interactivo">
                    <!-- IMAGEN CON ID PARA RECALIBRADO RESPONSIVE -->
                    <img src="img/esqueleto.png" usemap="#mapa-huesos" class="esqueleto-img" id="img-esqueleto" alt="Esqueleto interactivo">

                    <!-- MAPA CON ATRIBUTOS data-zona PARA FILTRADO DINÁMICO EN LA SPA -->
                    <map name="mapa-huesos" id="mapa-huesos">
                        <area shape="circle" coords="105,90,15" href="#/catalogo?zona=clavicula" data-zona="clavicula" alt="Clavícula">
                        <area shape="circle" coords="200,142,15" href="#/catalogo?zona=humero" data-zona="humero" alt="Húmero">
                        <area shape="circle" coords="90,200,15" href="#/catalogo?zona=antebrazo" data-zona="antebrazo" alt="Antebrazo">
                        <area shape="circle" coords="85,230,15" href="#/catalogo?zona=antebrazo" data-zona="antebrazo" alt="Radio y Cúbito">
                        <area shape="circle" coords="223,245,15" href="#/catalogo?zona=mano" data-zona="mano" alt="Mano">
                        <area shape="circle" coords="160,205,15" href="#/catalogo?zona=cadera" data-zona="cadera" alt="Cadera">
                        <area shape="circle" coords="169,285,15" href="#/catalogo?zona=femur" data-zona="femur" alt="Fémur">
                        <area shape="circle" coords="180,360,15" href="#/catalogo?zona=tibia" data-zona="tibia" alt="Tibia">
                        <area shape="circle" coords="130,400,15" href="#/catalogo?zona=perone" data-zona="perone" alt="Peroné">
                        <area shape="circle" coords="175,420,15" href="#/catalogo?zona=pie" data-zona="pie" alt="Pie">
                    </map>

                    <!-- TEXTOS FLOTANTES -->
                    <div class="texto-hueso" style="top: 20.95%; left: 35%;">Clavícula</div>
                    <div class="texto-hueso" style="top: 33.05%; left: 70.00%;">Húmero</div>
                    <div class="texto-hueso" style="top: 46.55%; left: 32.14%;">Antebrazo</div>
                    <div class="texto-hueso" style="top: 53.53%; left: 30.36%;">Radio y Cúbito</div>
                    <div class="texto-hueso" style="top: 56%; left: 76%;">Mano</div>
                    <div class="texto-hueso" style="top: 45%; left: 60%;">Cadera</div>
                    <div class="texto-hueso" style="top: 66.33%; left: 60.36%;">Fémur</div>
                    <div class="texto-hueso" style="top: 85%; left: 64.29%;">Tibia</div>
                    <div class="texto-hueso" style="top: 93%; left: 46.43%;">Peroné</div>
                    <div class="texto-hueso" style="top: 95%; left: 62.50%;">Pie</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Contenedor donde se cargarán los productos al hacer clic en el esqueleto -->
    <div id="resultados-zona" class="contenedor-resultados-zona" style="margin-top: 2rem; padding: 1rem;"></div>
  </template>

  <template id="tpl-catalogo">
    <section class="contenedor-productos" aria-labelledby="t-cat">
      <h2 id="t-cat">Catálogo de productos</h2>
      <p id="cat-estado" role="status"></p>
      
      <!-- Controles para alternar entre Vista Grilla (Box) y Vista Tabla -->
      <div class="controles-vista" style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
        <button type="button" id="btn-vista-box" class="btn-sec">Vista Tarjetas</button>
        <button type="button" id="btn-vista-tabla" class="btn-sec">Vista Tabla</button>
      </div>

      <!-- Contenedor dinámico de productos (soporta tanto grid de tarjetas como tabla) -->
      <div id="catalogo-contenido-dinamico">
        <div class="tabla-scroll">
          <table class="product-table">
            <caption class="sr-only">Listado de productos con precio y stock</caption>
            <thead><tr>
              <th scope="col">ID</th><th scope="col">Producto</th><th scope="col">Descripción</th>
              <th scope="col">Precio</th><th scope="col">Stock</th><th scope="col" id="th-acciones" hidden>Acciones</th>
            </tr></thead>
            <tbody id="cat-cuerpo"></tbody>
          </table>
        </div>
      </div>

      <form id="form-producto" hidden>
        <h3 id="t-form">Nuevo producto</h3>
        <input type="hidden" id="p-id">
        <div class="form-group"><label for="p-nombre">Nombre:</label><input type="text" id="p-nombre" required maxlength="120"></div>
        <div class="form-group"><label for="p-descripcion">Descripción:</label><input type="text" id="p-descripcion" maxlength="255"></div>
        <div class="form-group"><label for="p-precio">Precio:</label><input type="number" id="p-precio" required min="0" step="0.01"></div>
        <div class="form-group"><label for="p-stock">Stock:</label><input type="number" id="p-stock" required min="0" step="1" value="0"></div>
        <div class="form-group"><label for="p-categoria">Categoría:</label><input type="text" id="p-categoria" value="osteosintesis" maxlength="40"></div>
        <button type="submit" class="btn-submit">Guardar</button>
        <button type="button" class="btn-sec" id="p-cancelar">Cancelar</button>
        <p id="p-mensaje" role="status"></p>
      </form>
    </section>
  </template>

  <template id="tpl-ingresar">
    <div class="login-container">
      <section aria-labelledby="t-login">
        <h2 id="t-login">Iniciar sesión</h2>
        <form id="form-login">
          <div class="form-group"><label for="email">Correo electrónico:</label><input type="email" id="email" autocomplete="username" required></div>
          <div class="form-group"><label for="password">Contraseña:</label><input type="password" id="password" autocomplete="current-password" required></div>
          <button type="submit" class="btn-submit">Ingresar</button>
          <p id="msg-login" role="status"></p>
        </form>
      </section>
      <section aria-labelledby="t-reg">
        <h2 id="t-reg">Crear cuenta</h2>
        <form id="form-registro">
          <div class="form-group"><label for="reg-nombre">Nombre completo:</label><input type="text" id="reg-nombre" autocomplete="name" required maxlength="100"></div>
          <div class="form-group"><label for="reg-email">Correo electrónico:</label><input type="email" id="reg-email" autocomplete="email" required></div>
          <div class="form-group"><label for="reg-password">Contraseña (mínimo 8 caracteres):</label><input type="password" id="reg-password" autocomplete="new-password" required minlength="8"></div>
          <button type="submit" class="btn-submit">Registrarme</button>
          <p id="msg-registro" role="status"></p>
        </form>
      </section>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
