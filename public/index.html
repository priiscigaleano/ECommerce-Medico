<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tienda de insumos de traumatología y osteosíntesis.">
  <title>La Tienda del Traumatólogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <header>
    <div class="header-content">
      <div class="logo">
        <img src="img/logo-tienda.png" alt="" width="60" height="60">
        <h1>La Tienda del Traumatólogo</h1>
      </div>

      <nav aria-label="Principal">
        <ul class="nav-principal">
          <li><a href="#/inicio">Inicio</a></li>
          <li><a href="#/catalogo">Catálogo</a></li>
          <li><a href="#/ingresar" class="enlace-sesion">Ingresar</a></li>
        </ul>
      </nav>

      <button type="button" class="menu-icon" id="btn-menu" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="menu-movil">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu-secundario" id="menu-movil" aria-label="Menú móvil">
        <ul>
          <li class="item-movil"><a href="#/inicio">Inicio</a></li>
          <li class="item-movil"><a href="#/catalogo">Catálogo</a></li>
          <li class="item-movil"><a href="#/ingresar" class="enlace-sesion">Ingresar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenedor donde app.js monta cada vista; aria-live avisa los cambios a lectores de pantalla -->
  <main id="vista" tabindex="-1" aria-live="polite"></main>

  <footer>
    <p>&copy; 2026 La Tienda del Traumatólogo. Todos los derechos reservados.</p>
  </footer>

  <!-- VISTA: INICIO -->
  <template id="tpl-inicio">
    <div class="contenedor-principal">
      <!-- COLUMNA IZQUIERDA: HERO -->
      <div class="columna-hero">
        <section class="hero">
          <h2>Bienvenido</h2>
          <div class="hero-contenido">
            <img src="img/imagenindex.jpg" alt="Imagen representativa de TraumaShop" class="hero-image">
            <div class="hero-text">
              <p>
                Ofrecemos productos especializados en salud musculoesquelética, respaldados por el <strong>Instituto de Traumatología</strong>.
              </p>
              <p>
                Nuestro catálogo incluye una amplia variedad de férulas, ortesis, placas, tornillos y kits de osteosíntesis, diseñados para satisfacer las necesidades de los profesionales de la salud.
              </p>
              <p>
                Explora nuestro catálogo y encuentra el apoyo que necesitas para tu recuperación y bienestar.
              </p>
            </div>
          </div>
        </section>
      </div>

      <!-- COLUMNA DERECHA: ESQUELETO -->
      <div class="columna-esqueleto">
        <div class="caja-esqueleto">
          <div class="seccion-titulos">
            <h1>Presiona un Hueso para Ver los Productos</h1>
            <h2>PLACAS Y TORNILLOS PARA OSTEOSINTESIS</h2>
          </div>

          <div class="esqueleto-interactivo">
            <!-- IMAGEN CON ID PARA RECALIBRADO RESPONSIVE -->
            <img src="img/esqueleto.png" usemap="#mapa-huesos" class="esqueleto-img" id="img-esqueleto" alt="Esqueleto interactivo">

            <!-- MAPA CON ATRIBUTOS data-zona PARA FILTRADO DINÁMICO EN LA SPA -->
            <map name="mapa-huesos" id="mapa-huesos">
              <area shape="circle" coords="105,90,15" href="#/catalogo?area=clavicula" data-area="clavicula" alt="Clavícula">
              <area shape="circle" coords="200,142,15" href="#/catalogo?area=humero" data-area="humero" alt="Húmero">
              <area shape="circle" coords="90,200,15" href="#/catalogo?area=antebrazo" data-area="antebrazo" alt="Antebrazo">
              <area shape="circle" coords="85,230,15" href="#/catalogo?area=radio-cubito" data-area="radio-cubito" alt="Radio y Cúbito">
              <area shape="circle" coords="223,245,15" href="#/catalogo?area=mano" data-area="mano" alt="Mano">
              <area shape="circle" coords="160,205,15" href="#/catalogo?area=cadera" data-area="cadera" alt="Cadera">
              <area shape="circle" coords="169,285,15" href="#/catalogo?area=femur" data-area="femur" alt="Fémur">
              <area shape="circle" coords="180,360,15" href="#/catalogo?area=tibia" data-area="tibia" alt="Tibia">
              <area shape="circle" coords="130,400,15" href="#/catalogo?area=perone" data-area="perone" alt="Peroné">
              <area shape="circle" coords="175,420,15" href="#/catalogo?area=pie" data-area="pie" alt="Pie">
            </map>

            <!-- TEXTOS FLOTANTES -->
            <div class="texto-hueso" style="top: 20.95%; left: 35%;">Clavícula</div>
            <div class="texto-hueso" style="top: 33.05%; left: 70.00%;">Húmero</div>
            <div class="texto-hueso" style="top: 46.55%; left: 32.14%;">Antebrazo</div>
            <div class="texto-hueso" style="top: 53.53%; left: 30.36%;">Radio y Cúbito</div>
            <div class="texto-hueso" style="top: 56%; left: 76%;">Mano</div>
            <div class="texto-hueso" style="top: 45%; left: 60%;">Cadera</div>
            <div class="texto-hueso" style="top: 66.33%; left: 60.36%;">Fémur</div>
            <div class="texto-hueso" style="top: 85%; left: 64.29%;">Tibia</div>
            <div class="texto-hueso" style="top: 93%; left: 46.43%;">Peroné</div>
            <div class="texto-hueso" style="top: 95%; left: 62.50%;">Pie</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenedor donde se cargarán los productos al hacer clic en el esqueleto -->
    <div id="resultados-zona" class="contenedor-resultados-zona" style="margin-top: 2rem; padding: 1rem;"></div>
  </template>

  <!-- VISTA: CATÁLOGO -->
  <template id="tpl-catalogo">
    <section class="contenedor-productos" aria-labelledby="t-cat">
      <h2 id="t-cat">Catálogo de productos</h2>
      <p id="cat-estado" role="status"></p>

      <!-- Controles para alternar entre Vista Grilla (Box) y Vista Tabla -->
      <div class="controles-vista" style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
        <button type="button" id="btn-vista-box" class="btn-sec">Vista Tarjetas</button>
        <button type="button" id="btn-vista-tabla" class="btn-sec">Vista Tabla</button>
      </div>

      <!-- Contenedor dinámico de productos (soporta tanto grid de tarjetas como tabla) -->
      <div id="catalogo-contenido-dinamico">
        <div class="tabla-scroll">
          <table class="product-table">
            <caption class="sr-only">Listado de productos con precio y stock</caption>
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Producto</th>
                <th scope="col">Descripción</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col" id="th-acciones" hidden>Acciones</th>
              </tr>
            </thead>
            <tbody id="cat-cuerpo"></tbody>
          </table>
        </div>
      </div>

      <form id="form-producto" hidden>
        <h3 id="t-form">Nuevo producto</h3>
        <input type="hidden" id="p-id">
        <div class="form-group">
          <label for="p-nombre">Nombre:</label>
          <input type="text" id="p-nombre" required maxlength="120">
        </div>
        <div class="form-group">
          <label for="p-descripcion">Descripción:</label>
          <input type="text" id="p-descripcion" maxlength="255">
        </div>
        <div class="form-group">
          <label for="p-precio">Precio:</label>
          <input type="number" id="p-precio" required min="0" step="0.01">
        </div>
        <div class="form-group">
          <label for="p-stock">Stock:</label>
          <input type="number" id="p-stock" required min="0" step="1" value="0">
        </div>
        <div class="form-group">
          <label for="p-categoria">Categoría:</label>
          <input type="text" id="p-categoria" value="osteosintesis" maxlength="40">
        </div>
        <div class="form-group">
          <label for="p-area">Zona del esqueleto:</label>
          <select id="p-area"><option value="">— Sin zona —</option><option value="clavicula">Clavícula</option><option value="humero">Húmero</option><option value="antebrazo">Antebrazo</option><option value="radio-cubito">Radio y Cúbito</option><option value="mano">Mano</option><option value="cadera">Cadera</option><option value="femur">Fémur</option><option value="tibia">Tibia</option><option value="perone">Peroné</option><option value="pie">Pie</option></select>
        </div>
        <button type="submit" class="btn-submit">Guardar</button>
        <button type="button" class="btn-sec" id="p-cancelar">Cancelar</button>
        <p id="p-mensaje" role="status"></p>
      </form>
    </section>
  </template>

  <!-- VISTA: INGRESAR / REGISTRO -->
  <template id="tpl-ingresar">
    <div class="auth-wrapper">
      <div class="auth-card">
        <!-- COLUMNA IZQUIERDA: Formulario de Ingreso y Registro -->
        <div class="auth-form-container">
          <div>
            <div class="auth-header-brand">
              <img src="img/logo-tienda.png" alt="Logo" width="36" height="36">
              <span>La Tienda del Traumatólogo</span>
            </div>

            <div class="auth-titles">
              <h2>Bienvenido</h2>
              <p>Ingresá a tu cuenta o create una nueva</p>
            </div>

            <!-- Formulario de Login -->
            <form id="form-login" class="auth-form">
              <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" autocomplete="username" placeholder="ejemplo@dominio.com" required>
              </div>
              <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn-submit">Ingresar</button>
              <p id="msg-login" role="status" class="auth-msg"></p>
            </form>

            <div class="auth-divider"><span>o registrate</span></div>

            <!-- Formulario de Registro -->
            <form id="form-registro" class="auth-form">
              <div class="form-group">
                <label for="reg-nombre">Nombre completo</label>
                <input type="text" id="reg-nombre" autocomplete="name" placeholder="Tu nombre" required maxlength="100">
              </div>
              <div class="form-group">
                <label for="reg-email">Correo electrónico</label>
                <input type="email" id="reg-email" autocomplete="email" placeholder="ejemplo@dominio.com" required>
              </div>
              <div class="form-group">
                <label for="reg-password">Contraseña (mín. 8 caracteres)</label>
                <input type="password" id="reg-password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8">
              </div>
              <button type="submit" class="btn-submit btn-secondary-auth">Registrarme</button>
              <p id="msg-registro" role="status" class="auth-msg"></p>
            </form>
          </div>

          <div class="auth-footer-copy">
            <p>Copyright &copy; 2026 La Tienda del Traumatólogo.</p>
          </div>
        </div>

        <!-- COLUMNA DERECHA: Panel Visual con Imagen -->
        <div class="auth-visual-panel">
          <div class="visual-content">
            <span class="visual-badge">Excelencia Médica</span>
            <h2>Tecnología avanzada para la salud osteoarticular</h2>
          </div>
          <div class="visual-image-wrapper">
            <!-- Cambiá "img/imagenindex.jpg" por el nombre de tu archivo de imagen nuevo -->
            <img src="img/imagenlogin.jpg" alt="Traumatología" class="auth-banner-img">
            <div class="floating-story-card">
              <h4>Instituto de Traumatología</h4>
              <p>Insumos certificados de alta calidad.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
